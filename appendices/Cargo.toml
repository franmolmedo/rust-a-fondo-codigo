[workspace]
members = ["first-steps", "lab", "native-checksum", "loom-model", "inventory-cli", "sum-service", "portable-core"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Francisco M. Olmedo Bueno"]
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
