[package]
name = "course-solutions"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Francisco M. Olmedo Bueno"]
license = "MIT"
publish = false

[features]
default = []
json = ["dep:serde_json"]

[dependencies]
course-macro-api = { path = "../macro_api" }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[lints]
workspace = true
