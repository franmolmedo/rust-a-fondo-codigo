name: Verificación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Rust 1.95 · corpus completo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Mostrar toolchain
        run: |
          rustc --version
          cargo --version
          python3 --version

      - name: Verificar corpus, soluciones y toolchain
        run: python3 tools/verify.py
