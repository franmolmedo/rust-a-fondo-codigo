[package]
name = "rust-a-fondo-code"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Código, ejercicios y corpus verificable del libro Rust a fondo"
authors = ["Francisco M. Olmedo Bueno"]
license = "MIT"
repository = "https://github.com/franmolmedo/rust-a-fondo-codigo"
readme = "README.md"
publish = false

[workspace]
members = ["solutions", "macro_lab", "macro_api", "macro_fixture"]
resolver = "3"

[lib]
path = "src/lib.rs"

[dependencies]
axum = "0.8"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full", "test-util"] }
tracing = { version = "0.1", features = ["attributes"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"

[lints]
workspace = true
